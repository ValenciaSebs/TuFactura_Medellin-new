{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/login_adminnn.css' %}">
</head>
<body>
    <!-- mostrar las notificaciones -->
    <div class="login-container">
        <!-- mostrar las notificaciones -->
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li {% if message.tags %} class="{{ message.tags }}" {% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        <h1 style="color: #3437db;">Admin - TuFactura</h1>
        <img src="{% static 'img/admin.jpeg' %}" alt="Logo" width="325" height="300"><br>
        <form action="#" method="post">
            {% csrf_token %}
            <label for="codigo_ini">Codigo de inicio:</label>
            <input id="codigo_ini" class="form-control" type="text" name="codigo_ini" placeholder="Codigo de inicio" required>
            <label for="contraseña">Contraseña:</label>
            <input id="contraseña" class="form-control" type="password" name="contraseña" placeholder="contraseña" required>
            <button class="btn btn-info w-100" type="submit">ingresar</button>
            <div style="margin: 10px 0;"></div> <!-- Espacio entre los botones -->
            <a href="{% url 'index' %}" class="btn btn-info w-100">Volver al Índice</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
